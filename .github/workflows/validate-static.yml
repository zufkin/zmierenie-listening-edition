name: Validate Listening Edition

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s manifest.json
          test -s app.webmanifest
          test -s sw.js
          test -s book/index.html
          test -s book/chapter.css
          test -s book/chapter.js
      - name: Validate JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          for p in ['manifest.json','app.webmanifest']:
              with open(p, encoding='utf-8') as f:
                  json.load(f)
              print('OK', p)
          PY
      - name: Check local asset references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          missing=[]
          for name in ['index.html','app.js','styles.css','sw.js']:
              text=Path(name).read_text(encoding='utf-8')
              for ref in re.findall(r"(?:src|href)=[\"']([^\"'#?]+)|[\"']([^\"']+\.(?:mp3|png|css|js|json))[\"']", text):
                  target=next((x for x in ref if x), '')
                  if target.startswith(('http://','https://','data:','/')): continue
                  if target and not Path(target).exists(): missing.append((name,target))
          if missing:
              raise SystemExit('Missing local assets: '+repr(missing))
          print('Local asset references OK')
          PY
      - name: Validate full book and audio disclosures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          chapters=sorted(Path('book').glob('chapter-[0-9][0-9].html'))
          if len(chapters) != 12:
              raise SystemExit(f'Expected 12 chapters, found {len(chapters)}')
          for i,p in enumerate(chapters,1):
              text=p.read_text(encoding='utf-8')
              expected=f'./audio/zmierenie-{i:02d}-reflexia.mp3'
              checks={
                  'reflection audio': expected in text,
                  'chapter stylesheet': 'href="./chapter.css"' in text,
                  'chapter script': '<script src="./chapter.js"></script>' in text,
                  'audio extension': 'audio-extension' in text,
              }
              failed=[name for name,ok in checks.items() if not ok]
              if failed:
                  raise SystemExit(f'{p}: missing {failed}')
              if not Path('book/audio',f'zmierenie-{i:02d}-reflexia.mp3').is_file():
                  raise SystemExit(f'{p}: missing audio file')
          long_note='Experimentálna audio vrstva so synteticky generovaným hlasom pomocou AI.'
          short_note='Experimentálna vrstva – syntetický hlas.'
          if long_note not in Path('book/index.html').read_text(encoding='utf-8'):
              raise SystemExit('Book index is missing the approved full AI audio disclosure')
          if short_note not in Path('book/chapter.js').read_text(encoding='utf-8'):
              raise SystemExit('Chapter JS is missing the short disclosure')
          if short_note not in Path('book/chapter.css').read_text(encoding='utf-8'):
              raise SystemExit('CSS fallback is missing the short disclosure')
          print('Book QA OK: 12 chapters, 12 audio files, disclosure JS + CSS fallback')
          PY
