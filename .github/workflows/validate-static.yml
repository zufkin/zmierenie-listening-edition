name: Validate Listening Edition

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s manifest.json
          test -s app.webmanifest
          test -s sw.js
          test -s book/index.html
          test -s book/chapter.css
          test -s book/chapter.js
          test -s book/book.js
          test -s book/book-ui.css
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check book/book.js
          node --check book/chapter.js
          node --check book/theme-bridge.js
      - name: Validate JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          for p in ['manifest.json','app.webmanifest']:
              with open(p, encoding='utf-8') as f:
                  json.load(f)
              print('OK', p)
          PY
      - name: Check local asset references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          missing=[]
          files=['index.html','app.js','styles.css','sw.js','book/index.html','book/book.js','book/chapter.js']
          for name in files:
              text=Path(name).read_text(encoding='utf-8')
              for ref in re.findall(r"(?:src|href)=[\"']([^\"'#?]+)|[\"']([^\"']+\.(?:mp3|png|css|js|json))[\"']", text):
                  target=next((x for x in ref if x), '')
                  if '${' in target: continue
                  if target.startswith(('http://','https://','data:','/')): continue
                  if target.startswith('./'):
                      path=(Path(name).parent/target).resolve()
                      root=Path('.').resolve()
                      if not str(path).startswith(str(root)) or not path.exists(): missing.append((name,target))
                  elif target and not Path(target).exists(): missing.append((name,target))
          if missing:
              raise SystemExit('Missing local assets: '+repr(missing))
          print('Local asset references OK')
          PY
      - name: Validate full book and learning layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          chapters=sorted(Path('book').glob('chapter-[0-9][0-9].html'))
          if len(chapters) != 12:
              raise SystemExit(f'Expected 12 chapters, found {len(chapters)}')
          pedagogical=['orientation-panel','class="learning"','id="dialogue"','id="reflection"','class="takeaway"','class="stops"','class="discernment"','class="teacher-box"','class="resources"','class="bibliography"','Jadro kapitoly je celý text.']
          for i,p in enumerate(chapters,1):
              text=p.read_text(encoding='utf-8')
              expected=f'./audio/zmierenie-{i:02d}-reflexia.mp3'
              checks={
                  'reflection audio': expected in text,
                  'chapter stylesheet': 'href="./chapter.css"' in text,
                  'chapter script': '<script src="./chapter.js"></script>' in text,
                  'audio extension': 'audio-extension' in text,
                  'notes': f'data-notes="chapter-{i}"' in text,
                  'pedagogical structure': all(marker in text for marker in pedagogical),
              }
              failed=[name for name,ok in checks.items() if not ok]
              if failed:
                  raise SystemExit(f'{p}: missing {failed}')
              if not Path('book/audio',f'zmierenie-{i:02d}-reflexia.mp3').is_file():
                  raise SystemExit(f'{p}: missing audio file')
          sensitive={
              5:['bezpeč','zneuž','odpustenie','zodpoved'],
              6:['dôstoj','hanb','bezpeč','zodpoved'],
              9:['Mediácia nie je vhodná','násil','ochran','nerovnováh'],
              11:['Magnifica humanitas','Antiqua et nova','transparentn','zodpoved'],
          }
          for n,markers in sensitive.items():
              text=Path(f'book/chapter-{n:02d}.html').read_text(encoding='utf-8').lower()
              missing=[m for m in markers if m.lower() not in text]
              if missing: raise SystemExit(f'chapter {n}: missing theological/safety guardrails {missing}')
          index=Path('book/index.html').read_text(encoding='utf-8')
          long_note='Experimentálna audio vrstva so synteticky generovaným hlasom pomocou AI.'
          short_note='Experimentálna vrstva – syntetický hlas.'
          if long_note not in index: raise SystemExit('Book index is missing the full AI audio disclosure')
          if 'https://tf.truni.sk/sites/default/files/book/zmierenie-ucebnica.pdf' not in index: raise SystemExit('Stable PDF link is missing')
          if index.count('data-chapter-card=') != 12: raise SystemExit('Index must expose 12 chapter cards')
          if './book.js' not in index or './book-ui.css' not in index: raise SystemExit('Index learning UI assets are missing')
          if short_note not in Path('book/chapter.js').read_text(encoding='utf-8'): raise SystemExit('Chapter JS is missing the short disclosure')
          if short_note not in Path('book/chapter.css').read_text(encoding='utf-8'): raise SystemExit('CSS fallback is missing the short disclosure')
          print('Book QA OK: technical + pedagogical + theological/safety regression checks passed')
          PY
